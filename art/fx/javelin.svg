<?xml version="1.0" encoding="UTF-8"?>
<!--
  Barracks projectile: a garrison throwing javelin.
  96px canvas over a 32-unit viewBox, authored pointing RIGHT (+X) and
  centred vertically on y=16 so Projectile can rotate it about its middle.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 32 32">
	<defs>
		<linearGradient id="jHead" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#EAF1F6"/>
			<stop offset="0.5" stop-color="#9EACB8"/>
			<stop offset="1" stop-color="#55606A"/>
		</linearGradient>
		<linearGradient id="jHaft" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#D2A063"/>
			<stop offset="0.5" stop-color="#A0703B"/>
			<stop offset="1" stop-color="#5E3E1D"/>
		</linearGradient>
	</defs>

	<!-- Blue trailing streamer, the barracks tell. -->
	<path d="M 3 13.8 L 9 15.2 L 9 16.8 L 3 18.2 L 5.2 16 Z" fill="#4E6FA8" stroke="#211A16" stroke-width="1.2" stroke-linejoin="round"/>

	<!-- Haft with a lit top edge and two grip bindings. -->
	<rect x="7" y="14.6" width="15" height="2.8" rx="1" fill="url(#jHaft)" stroke="#211A16" stroke-width="1.3"/>
	<line x1="8" y1="15.5" x2="21" y2="15.5" stroke="#E4B87A" stroke-width="0.8" opacity="0.85"/>
	<g stroke="#211A16" stroke-width="1">
		<line x1="12.5" y1="14" x2="12.5" y2="18"/>
		<line x1="15" y1="14" x2="15" y2="18"/>
	</g>

	<!-- Steel head with a specular flick along the upper facet. -->
	<path d="M 20 11.6 L 30 16 L 20 20.4 L 22.6 16 Z" fill="url(#jHead)" stroke="#211A16" stroke-width="1.4" stroke-linejoin="round"/>
	<path d="M 22 13.6 L 27.6 15.8" fill="none" stroke="#F8FCFF" stroke-width="0.9" stroke-linecap="round" opacity="0.95"/>
</svg>
