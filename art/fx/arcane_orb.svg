<?xml version="1.0" encoding="UTF-8"?>
<!--
  Mage projectile: a bound arcane orb with a comet tail.
  96px canvas over a 32-unit viewBox, authored pointing RIGHT (+X). The core
  sits forward of centre so the tail streams behind the travel direction.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 32 32">
	<defs>
		<radialGradient id="oCore" cx="0.38" cy="0.34" r="0.72">
			<stop offset="0" stop-color="#FFFFFF"/>
			<stop offset="0.32" stop-color="#EFE2FF"/>
			<stop offset="0.72" stop-color="#9A5FE8"/>
			<stop offset="1" stop-color="#54269B"/>
		</radialGradient>
		<radialGradient id="oHalo" cx="0.5" cy="0.5" r="0.5">
			<stop offset="0" stop-color="#D3AEFF" stop-opacity="0.7"/>
			<stop offset="0.55" stop-color="#9A5FE8" stop-opacity="0.3"/>
			<stop offset="1" stop-color="#7B3FD4" stop-opacity="0"/>
		</radialGradient>
	</defs>

	<!-- Comet tail, two densities so it fades rather than ends. -->
	<path d="M 19 11.4 Q 4 16 19 20.6 Z" fill="#A96BF0" opacity="0.4"/>
	<path d="M 19 13.6 Q 10 16 19 18.4 Z" fill="#EFE2FF" opacity="0.55"/>

	<!-- Halo, then the core. -->
	<circle cx="19.5" cy="16" r="11" fill="url(#oHalo)"/>
	<circle cx="19.5" cy="16" r="6.6" fill="url(#oCore)" stroke="#3B1D6B" stroke-width="1.2"/>
	<circle cx="17.3" cy="13.8" r="2" fill="#FFFFFF" opacity="0.85"/>

	<!-- Bound rune shards riding the orb's field. -->
	<g fill="#F0E2FF" stroke="#3B1D6B" stroke-width="0.7" stroke-linejoin="round">
		<path d="M 27.5 9.5 L 29 12 L 27.5 14.5 L 26 12 Z"/>
		<path d="M 26 19.5 L 27.2 21.5 L 26 23.5 L 24.8 21.5 Z"/>
	</g>
</svg>
