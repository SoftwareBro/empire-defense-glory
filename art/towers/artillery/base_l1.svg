<?xml version="1.0" encoding="UTF-8"?>
<!--
  Artillery - static half: a riveted iron gun platform on a stone footing.

  Authored on a 96-unit viewBox with the pivot on the exact canvas centre
  (48,48). Key light from the top-left, so highlights hug the upper-left rim
  and every contact shadow falls down-right.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 96 96">
	<defs>
		<radialGradient id="footing" cx="0.34" cy="0.28" r="0.82">
			<stop offset="0" stop-color="#D2C6B6"/>
			<stop offset="0.5" stop-color="#9C8E7C"/>
			<stop offset="1" stop-color="#5C5145"/>
		</radialGradient>
		<radialGradient id="irondeck" cx="0.36" cy="0.30" r="0.80">
			<stop offset="0" stop-color="#8C8379"/>
			<stop offset="0.6" stop-color="#5C554D"/>
			<stop offset="1" stop-color="#312C28"/>
		</radialGradient>
		<linearGradient id="gunmount" x1="0.2" y1="0.1" x2="0.8" y2="0.95">
			<stop offset="0" stop-color="#AD9678"/>
			<stop offset="1" stop-color="#493C2F"/>
		</linearGradient>
	</defs>

	<ellipse cx="49" cy="53" rx="41" ry="38" fill="#1B1410" opacity="0.28"/>

	<!-- Recoil braces on the diagonals. -->
	<g fill="#8F8474" stroke="#2B211C" stroke-width="2.2" stroke-linejoin="round">
		<g transform="rotate(45 48 48)"><path d="M 74 38 L 89 41.5 L 89 54.5 L 74 58 Z"/></g>
		<g transform="rotate(135 48 48)"><path d="M 74 38 L 89 41.5 L 89 54.5 L 74 58 Z"/></g>
		<g transform="rotate(225 48 48)"><path d="M 74 38 L 89 41.5 L 89 54.5 L 74 58 Z"/></g>
		<g transform="rotate(315 48 48)"><path d="M 74 38 L 89 41.5 L 89 54.5 L 74 58 Z"/></g>
	</g>
	<g fill="#B9AC98" opacity="0.75">
		<g transform="rotate(45 48 48)"><circle cx="83" cy="48" r="1.4"/></g>
		<g transform="rotate(135 48 48)"><circle cx="83" cy="48" r="1.4"/></g>
		<g transform="rotate(225 48 48)"><circle cx="83" cy="48" r="1.4"/></g>
		<g transform="rotate(315 48 48)"><circle cx="83" cy="48" r="1.4"/></g>
	</g>

	<circle cx="48" cy="48" r="35" fill="url(#footing)" stroke="#2B211C" stroke-width="2.6"/>
	<g stroke="#5E5346" stroke-width="1.3" stroke-linecap="round" opacity="0.6">
		<line x1="74.31" y1="57.58" x2="80.42" y2="59.80"/>
		<line x1="59.83" y1="73.38" x2="62.58" y2="79.27"/>
		<line x1="38.42" y1="74.31" x2="36.20" y2="80.42"/>
		<line x1="22.62" y1="59.83" x2="16.73" y2="62.58"/>
		<line x1="21.69" y1="38.42" x2="15.58" y2="36.20"/>
		<line x1="36.17" y1="22.62" x2="33.42" y2="16.73"/>
		<line x1="57.58" y1="21.69" x2="59.80" y2="15.58"/>
		<line x1="73.38" y1="36.17" x2="79.27" y2="33.42"/>
	</g>
	<path d="M 16.99 36.71 A 33 33 0 0 1 69.21 22.72" fill="none" stroke="#FFF4DC" stroke-width="2.2" stroke-linecap="round" opacity="0.38"/>

	<!-- Traverse ring the gun swings on, with its drive teeth. -->
	<circle cx="48" cy="48" r="27.5" fill="none" stroke="#2B211C" stroke-width="7"/>
	<circle cx="48" cy="48" r="27.5" fill="none" stroke="#6B6257" stroke-width="5"/>
	<g fill="#2B211C" opacity="0.7">
		<g transform="rotate(0 48 48)"><rect x="46.8" y="18.6" width="2.4" height="5"/></g>
		<g transform="rotate(30 48 48)"><rect x="46.8" y="18.6" width="2.4" height="5"/></g>
		<g transform="rotate(60 48 48)"><rect x="46.8" y="18.6" width="2.4" height="5"/></g>
		<g transform="rotate(90 48 48)"><rect x="46.8" y="18.6" width="2.4" height="5"/></g>
		<g transform="rotate(120 48 48)"><rect x="46.8" y="18.6" width="2.4" height="5"/></g>
		<g transform="rotate(150 48 48)"><rect x="46.8" y="18.6" width="2.4" height="5"/></g>
		<g transform="rotate(180 48 48)"><rect x="46.8" y="18.6" width="2.4" height="5"/></g>
		<g transform="rotate(210 48 48)"><rect x="46.8" y="18.6" width="2.4" height="5"/></g>
		<g transform="rotate(240 48 48)"><rect x="46.8" y="18.6" width="2.4" height="5"/></g>
		<g transform="rotate(270 48 48)"><rect x="46.8" y="18.6" width="2.4" height="5"/></g>
		<g transform="rotate(300 48 48)"><rect x="46.8" y="18.6" width="2.4" height="5"/></g>
		<g transform="rotate(330 48 48)"><rect x="46.8" y="18.6" width="2.4" height="5"/></g>
	</g>
	<path d="M 26.33 31.06 A 27.5 27.5 0 0 1 63.77 25.47" fill="none" stroke="#C9BFB0" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

	<!-- Riveted iron deck. -->
	<circle cx="48" cy="48" r="24" fill="url(#irondeck)" stroke="#2B211C" stroke-width="1.8"/>
	<g stroke="#241F1B" stroke-width="1.3" opacity="0.7">
		<line x1="25.4" y1="40" x2="70.6" y2="40"/>
		<line x1="25.4" y1="56" x2="70.6" y2="56"/>
		<line x1="48" y1="24.2" x2="48" y2="71.8"/>
	</g>
	<g fill="#A79C8C" opacity="0.8">
		<circle cx="36" cy="36" r="1.3"/>
		<circle cx="60" cy="36" r="1.3"/>
		<circle cx="36" cy="60" r="1.3"/>
		<circle cx="60" cy="60" r="1.3"/>
		<circle cx="29" cy="48" r="1.3"/>
		<circle cx="67" cy="48" r="1.3"/>
	</g>
	<path d="M 68.67 55.52 A 22 22 0 0 1 31.15 62.14" fill="none" stroke="#171412" stroke-width="3.5" stroke-linecap="round" opacity="0.3"/>

	<!-- Sandbag revetment, bottom-left. -->
	<g stroke="#3A2C1C" stroke-width="1.5">
		<ellipse cx="30" cy="62.5" rx="7.6" ry="4.4" fill="#B79E6B"/>
		<ellipse cx="37.5" cy="65" rx="7.6" ry="4.4" fill="#A68E5D"/>
		<ellipse cx="33.5" cy="57.6" rx="7" ry="4.2" fill="#D3BB88"/>
	</g>
	<g stroke="#6B5834" stroke-width="0.9" opacity="0.7">
		<line x1="30" y1="58.3" x2="30" y2="66.7"/>
		<line x1="37.5" y1="60.8" x2="37.5" y2="69.2"/>
		<line x1="33.5" y1="53.6" x2="33.5" y2="61.6"/>
	</g>

	<!-- Shot pyramid, bottom-right. -->
	<g stroke="#141110" stroke-width="1.5">
		<circle cx="59.5" cy="64.5" r="4.4" fill="#3B3734"/>
		<circle cx="67.5" cy="64.5" r="4.4" fill="#3B3734"/>
		<circle cx="63.5" cy="58.8" r="4.4" fill="#494542"/>
	</g>
	<g fill="#9A938C" opacity="0.8">
		<circle cx="58.1" cy="63.1" r="1.2"/>
		<circle cx="66.1" cy="63.1" r="1.2"/>
		<circle cx="62.1" cy="57.4" r="1.2"/>
	</g>

	<!-- Central swivel mount. -->
	<circle cx="48" cy="48" r="12" fill="#2B211C"/>
	<circle cx="48" cy="48" r="10.2" fill="url(#gunmount)"/>
	<circle cx="48" cy="48" r="6.4" fill="none" stroke="#2B211C" stroke-width="1.4" opacity="0.55"/>
	<g fill="#2B211C" opacity="0.8">
		<circle cx="54" cy="42" r="1.5"/>
		<circle cx="54" cy="54" r="1.5"/>
		<circle cx="42" cy="54" r="1.5"/>
		<circle cx="42" cy="42" r="1.5"/>
	</g>
	<path d="M 39.64 42.15 A 10.2 10.2 0 0 1 52.31 38.76" fill="none" stroke="#E0D5C4" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
</svg>
