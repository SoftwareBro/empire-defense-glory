<?xml version="1.0" encoding="UTF-8"?>
<!--
  Artillery - rotating half: a brass-banded siege mortar.

  Authored pointing RIGHT (+X) with the pivot on the exact canvas centre
  (48,48), because Godot rotates clockwise from +X.

  The muzzle mouth sits at x=92, i.e. 44 viewBox units past the pivot, which
  is why artillery.tres sets muzzle_offset = 30 (44 units * 0.667 px/unit).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 96 96">
	<defs>
		<linearGradient id="barrelG" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#9A9187"/>
			<stop offset="0.4" stop-color="#635B53"/>
			<stop offset="1" stop-color="#2E2A26"/>
		</linearGradient>
		<linearGradient id="bellG" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#8A8078"/>
			<stop offset="0.45" stop-color="#544C45"/>
			<stop offset="1" stop-color="#26221F"/>
		</linearGradient>
		<linearGradient id="brassG" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#F0C25F"/>
			<stop offset="0.5" stop-color="#C9922E"/>
			<stop offset="1" stop-color="#7E5A16"/>
		</linearGradient>
	</defs>

	<!-- Contact shadow, offset down-right to match the top-left key light. -->
	<ellipse cx="56" cy="52" rx="32" ry="12" fill="#1B1410" opacity="0.28"/>

	<!-- Trunnion cheek the barrel pivots in, drawn under the barrel. -->
	<rect x="36" y="33" width="13" height="30" rx="3.5" fill="#6B5A45" stroke="#211A16" stroke-width="2"/>

	<!-- Barrel. -->
	<path d="M 34 39 L 82 36.4 L 82 59.6 L 34 57 Q 29.5 48 34 39 Z" fill="url(#barrelG)" stroke="#211A16" stroke-width="2.4" stroke-linejoin="round"/>

	<!-- Brass reinforcing bands. -->
	<g stroke="#211A16" stroke-width="1.3">
		<rect x="50" y="37.4" width="5.2" height="21.2" fill="url(#brassG)"/>
		<rect x="65" y="36.8" width="5.2" height="22.4" fill="url(#brassG)"/>
	</g>
	<g stroke="#FFE7A8" stroke-width="0.9" opacity="0.75">
		<line x1="51.2" y1="38.4" x2="51.2" y2="57.6"/>
		<line x1="66.2" y1="37.8" x2="66.2" y2="58.2"/>
	</g>

	<!-- Flared muzzle bell and the bore itself. -->
	<path d="M 79 33.5 L 92 35.5 L 92 60.5 L 79 62.5 Z" fill="url(#bellG)" stroke="#211A16" stroke-width="2.2" stroke-linejoin="round"/>
	<ellipse cx="91" cy="48" rx="3.2" ry="12.5" fill="#17140F" stroke="#211A16" stroke-width="1.4"/>
	<ellipse cx="91.4" cy="48" rx="1.7" ry="9" fill="#2B2622"/>
	<path d="M 80 36.5 L 90.6 38.2" stroke="#B6AA9A" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>

	<!-- Barrel top highlight, over the bands so the form reads as one tube. -->
	<path d="M 36 40.8 L 79 38.4" fill="none" stroke="#BDB1A2" stroke-width="2" stroke-linecap="round" opacity="0.55"/>

	<!-- Breech cap and elevation screw at the back. -->
	<circle cx="34" cy="48" r="8.6" fill="#211A16"/>
	<circle cx="34" cy="48" r="7.3" fill="#7A6A55"/>
	<circle cx="34" cy="48" r="3" fill="#493C2F"/>
	<path d="M 29.2 43.6 A 7.3 7.3 0 0 1 37.4 41.1" fill="none" stroke="#D8C9AE" stroke-width="1.4" stroke-linecap="round" opacity="0.65"/>

	<!-- Swivel collar, drawn last so it caps the trunnion. -->
	<circle cx="48" cy="48" r="7.6" fill="#211A16"/>
	<circle cx="48" cy="48" r="6.4" fill="#8A7C68"/>
	<path d="M 43.6 43.6 A 6.4 6.4 0 0 1 52.4 43.6" fill="none" stroke="#E0D5C4" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
</svg>
