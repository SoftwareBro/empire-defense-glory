<?xml version="1.0" encoding="UTF-8"?>
<!--
  Barracks - rotating half: the duty guard's tower shield and javelin arm.

  Authored pointing RIGHT (+X) with the pivot on the exact canvas centre
  (48,48), because Godot rotates clockwise from +X.

  The javelin head reaches x=91, i.e. 43 viewBox units past the pivot, which
  is why barracks.tres sets muzzle_offset = 29 (43 units * 0.667 px/unit).
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 96 96">
	<defs>
		<linearGradient id="shieldG" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#7C9CD4"/>
			<stop offset="0.5" stop-color="#4E6FA8"/>
			<stop offset="1" stop-color="#2C4468"/>
		</linearGradient>
		<linearGradient id="shaftG" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#C08B4E"/>
			<stop offset="0.5" stop-color="#9A6B37"/>
			<stop offset="1" stop-color="#5E3E1D"/>
		</linearGradient>
		<linearGradient id="headG" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#EAF1F6"/>
			<stop offset="0.5" stop-color="#9EACB8"/>
			<stop offset="1" stop-color="#55606A"/>
		</linearGradient>
	</defs>

	<!-- Contact shadow, offset down-right to match the top-left key light. -->
	<ellipse cx="52" cy="51" rx="30" ry="12" fill="#1B1410" opacity="0.25"/>

	<!-- Javelin: butt-spike, shaft, grip bindings, steel head. -->
	<path d="M 41 45 L 32 48 L 41 51 Z" fill="#8B99A6" stroke="#211A16" stroke-width="1.5" stroke-linejoin="round"/>
	<rect x="39" y="46.3" width="43" height="3.6" rx="1.3" fill="url(#shaftG)" stroke="#211A16" stroke-width="1.6"/>
	<line x1="40.5" y1="47.5" x2="80.5" y2="47.5" stroke="#E4B87A" stroke-width="0.9" opacity="0.7"/>
	<g stroke="#211A16" stroke-width="1.3">
		<line x1="57" y1="45.6" x2="57" y2="50.6"/>
		<line x1="60.5" y1="45.6" x2="60.5" y2="50.6"/>
	</g>
	<path d="M 79 42 L 91 48 L 79 54 L 82.2 48 Z" fill="url(#headG)" stroke="#211A16" stroke-width="1.7" stroke-linejoin="round"/>
	<path d="M 81.5 44.4 L 88 47.6" fill="none" stroke="#F4F9FC" stroke-width="1" stroke-linecap="round" opacity="0.9"/>

	<!-- Tower shield, braced to the left so the silhouette reads instantly. -->
	<path d="M 31 33 L 46 35.5 L 46 60.5 L 31 63 Q 25.5 48 31 33 Z" fill="url(#shieldG)" stroke="#211A16" stroke-width="2.3" stroke-linejoin="round"/>
	<path d="M 27.6 48 L 46 48" stroke="#E8D189" stroke-width="1.9" opacity="0.95"/>
	<path d="M 38 34.6 L 38 61.4" stroke="#E8D189" stroke-width="1.9" opacity="0.95"/>
	<circle cx="38" cy="48" r="4.4" fill="#D9B45E" stroke="#211A16" stroke-width="1.6"/>
	<circle cx="36.8" cy="46.8" r="1.5" fill="#F7E4A8" opacity="0.9"/>
	<path d="M 31.6 34.8 Q 27.6 41.2 27.4 46" fill="none" stroke="#A9C4EE" stroke-width="1.7" stroke-linecap="round" opacity="0.75"/>

	<!-- Swivel collar, drawn last so it caps the shield and the shaft. -->
	<circle cx="48" cy="48" r="7.6" fill="#211A16"/>
	<circle cx="48" cy="48" r="6.4" fill="#6E7A88"/>
	<path d="M 43.6 43.6 A 6.4 6.4 0 0 1 52.4 43.6" fill="none" stroke="#D3DCE3" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
</svg>
