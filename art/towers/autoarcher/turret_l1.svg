<?xml version="1.0" encoding="UTF-8"?>
<!--
  Auto-Archer Tower - rotating half (repeating crossbow), level 1.

  Authored pointing RIGHT (+X) with the pivot on the exact canvas centre
  (48,48), because Godot rotates clockwise from +X.

  The bowstring, the nocked bolt and the magazine's bolt ends are deliberately
  NOT in this file - Tower._draw_bow_rig() draws them in code so they can be
  animated. Their coordinates live in tower.gd as viewBox units matching this
  canvas, so keep the limb tips at (83.5,26)/(83.5,70) and the drum at (40,48)
  in sync if this art is ever redrawn.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 96 96">
	<defs>
		<linearGradient id="stockG" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#C08B4E"/>
			<stop offset="0.45" stop-color="#9A6B37"/>
			<stop offset="1" stop-color="#5E3E1D"/>
		</linearGradient>
		<radialGradient id="drumG" cx="0.35" cy="0.3" r="0.8">
			<stop offset="0" stop-color="#F0C25F"/>
			<stop offset="0.6" stop-color="#D19A2E"/>
			<stop offset="1" stop-color="#8E6416"/>
		</radialGradient>
	</defs>

	<!-- Contact shadow, offset down-right to match the top-left key light. -->
	<ellipse cx="52" cy="51" rx="30" ry="12" fill="#1B1410" opacity="0.25"/>

	<!-- Bow limbs: dark outline pass, wood pass, then a thin top highlight. -->
	<g fill="none" stroke-linecap="round">
		<path d="M 66 43 C 71 34 77 28.5 83.5 26" stroke="#211A16" stroke-width="5.2"/>
		<path d="M 66 53 C 71 62 77 67.5 83.5 70" stroke="#211A16" stroke-width="5.2"/>
		<path d="M 66 43 C 71 34 77 28.5 83.5 26" stroke="#7A4B2A" stroke-width="3"/>
		<path d="M 66 53 C 71 62 77 67.5 83.5 70" stroke="#7A4B2A" stroke-width="3"/>
		<path d="M 66.5 42 C 71.5 33.3 77.3 27.9 83.7 25.3" stroke="#C08B4E" stroke-width="1.1" opacity="0.75"/>
		<path d="M 66.5 52.2 C 71.5 61 77.3 66.6 83.7 69.2" stroke="#C08B4E" stroke-width="1.1" opacity="0.75"/>
	</g>

	<!-- Steel nocks the drawn string hooks over. -->
	<circle cx="83.5" cy="26" r="2.6" fill="#8B99A6" stroke="#211A16" stroke-width="1.4"/>
	<circle cx="83.5" cy="70" r="2.6" fill="#8B99A6" stroke="#211A16" stroke-width="1.4"/>

	<!-- Wooden stock, waisted at the back so it reads as a held weapon. -->
	<path d="M 34 40.5 Q 30.5 48 34 55.5 L 70 53 Q 73.5 48 70 43 Z" fill="url(#stockG)" stroke="#211A16" stroke-width="2.2"/>

	<!-- Steel rail the bolt rides along. -->
	<path d="M 38 46.2 L 71 46.6 L 71 49.4 L 38 49.8 Z" fill="#4E5A66" stroke="#211A16" stroke-width="1.2"/>
	<line x1="39" y1="47.3" x2="70" y2="47.6" stroke="#AFBCC8" stroke-width="0.9" opacity="0.7"/>

	<!-- Front riser: the bolt passes over this on its way out. -->
	<rect x="63" y="40.5" width="7.5" height="15" rx="2" fill="#8B99A6" stroke="#211A16" stroke-width="1.8"/>
	<line x1="66.7" y1="41.5" x2="66.7" y2="54.5" stroke="#4E5A66" stroke-width="1.1"/>

	<!-- Brass magazine drum. Its six bolt ends are drawn in code and spin. -->
	<circle cx="40" cy="48" r="8.5" fill="#211A16"/>
	<circle cx="40" cy="48" r="7.6" fill="url(#drumG)"/>

	<!-- Stock top highlight, last so it sits over the wood. -->
	<line x1="35" y1="42.5" x2="68.5" y2="44.6" stroke="#E4B87A" stroke-width="1.5" opacity="0.6"/>
</svg>
