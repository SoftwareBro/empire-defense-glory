<?xml version="1.0" encoding="UTF-8"?>
<!--
  Mage Tower - static half: a rune-cut arcane platform over a ley-line well.

  Authored on a 96-unit viewBox with the pivot on the exact canvas centre
  (48,48). Key light from the top-left; the ley glow is the only light that
  comes from below, which is what sells it as magic rather than stone.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 96 96">
	<defs>
		<radialGradient id="arcstone" cx="0.34" cy="0.28" r="0.82">
			<stop offset="0" stop-color="#CFC3E4"/>
			<stop offset="0.5" stop-color="#9A88BE"/>
			<stop offset="1" stop-color="#4E3F71"/>
		</radialGradient>
		<radialGradient id="well" cx="0.36" cy="0.30" r="0.80">
			<stop offset="0" stop-color="#5E4A8E"/>
			<stop offset="0.6" stop-color="#3D2E62"/>
			<stop offset="1" stop-color="#241A3D"/>
		</radialGradient>
		<radialGradient id="ley" cx="0.5" cy="0.5" r="0.5">
			<stop offset="0" stop-color="#DBC2FF" stop-opacity="0.8"/>
			<stop offset="0.6" stop-color="#9A5FE8" stop-opacity="0.28"/>
			<stop offset="1" stop-color="#7B3FD4" stop-opacity="0"/>
		</radialGradient>
		<linearGradient id="obsidian" x1="0.2" y1="0.1" x2="0.8" y2="0.95">
			<stop offset="0" stop-color="#9E86C9"/>
			<stop offset="1" stop-color="#382A5A"/>
		</linearGradient>
	</defs>

	<ellipse cx="49" cy="53" rx="41" ry="38" fill="#1B1410" opacity="0.28"/>

	<!-- Rune monoliths on the diagonals, each with a lit sigil eye. -->
	<g fill="#6E5A99" stroke="#241C33" stroke-width="2.2" stroke-linejoin="round">
		<g transform="rotate(45 48 48)"><path d="M 74 38 L 89 41.5 L 89 54.5 L 74 58 Z"/></g>
		<g transform="rotate(135 48 48)"><path d="M 74 38 L 89 41.5 L 89 54.5 L 74 58 Z"/></g>
		<g transform="rotate(225 48 48)"><path d="M 74 38 L 89 41.5 L 89 54.5 L 74 58 Z"/></g>
		<g transform="rotate(315 48 48)"><path d="M 74 38 L 89 41.5 L 89 54.5 L 74 58 Z"/></g>
	</g>
	<g fill="#D9BFFF">
		<g transform="rotate(45 48 48)"><circle cx="82" cy="48" r="2.1"/></g>
		<g transform="rotate(135 48 48)"><circle cx="82" cy="48" r="2.1"/></g>
		<g transform="rotate(225 48 48)"><circle cx="82" cy="48" r="2.1"/></g>
		<g transform="rotate(315 48 48)"><circle cx="82" cy="48" r="2.1"/></g>
	</g>

	<circle cx="48" cy="48" r="35" fill="url(#arcstone)" stroke="#241C33" stroke-width="2.6"/>
	<path d="M 16.99 36.71 A 33 33 0 0 1 69.21 22.72" fill="none" stroke="#F2E8FF" stroke-width="2.2" stroke-linecap="round" opacity="0.4"/>

	<!-- Six carved glyphs set into the outer stone. -->
	<g stroke="#DCC4FF" stroke-width="1.7" stroke-linecap="round" fill="none" opacity="0.85">
		<g transform="rotate(0 48 48)"><path d="M 44.6 20.4 L 48 16.2 L 51.4 20.4 M 48 16.2 L 48 22.6"/></g>
		<g transform="rotate(60 48 48)"><path d="M 44.6 20.4 L 48 16.2 L 51.4 20.4 M 48 16.2 L 48 22.6"/></g>
		<g transform="rotate(120 48 48)"><path d="M 44.6 20.4 L 48 16.2 L 51.4 20.4 M 48 16.2 L 48 22.6"/></g>
		<g transform="rotate(180 48 48)"><path d="M 44.6 20.4 L 48 16.2 L 51.4 20.4 M 48 16.2 L 48 22.6"/></g>
		<g transform="rotate(240 48 48)"><path d="M 44.6 20.4 L 48 16.2 L 51.4 20.4 M 48 16.2 L 48 22.6"/></g>
		<g transform="rotate(300 48 48)"><path d="M 44.6 20.4 L 48 16.2 L 51.4 20.4 M 48 16.2 L 48 22.6"/></g>
	</g>

	<!-- Sigil ring. -->
	<circle cx="48" cy="48" r="27.5" fill="none" stroke="#241C33" stroke-width="7"/>
	<circle cx="48" cy="48" r="27.5" fill="none" stroke="#6B5796" stroke-width="5"/>
	<circle cx="48" cy="48" r="27.5" fill="none" stroke="#C9A6FF" stroke-width="1.5" opacity="0.7"/>
	<path d="M 26.33 31.06 A 27.5 27.5 0 0 1 63.77 25.47" fill="none" stroke="#E6D6FF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

	<!-- The well itself. -->
	<circle cx="48" cy="48" r="24" fill="url(#well)" stroke="#241C33" stroke-width="1.8"/>
	<circle cx="48" cy="48" r="22" fill="url(#ley)"/>

	<!-- Hexagram, the classic "this thing casts" read. -->
	<g fill="none" stroke="#B892F5" stroke-width="1.6" stroke-linejoin="round" opacity="0.9">
		<path d="M 48 31 L 62.7 56.5 L 33.3 56.5 Z"/>
		<path d="M 48 65 L 33.3 39.5 L 62.7 39.5 Z"/>
	</g>
	<circle cx="48" cy="48" r="16.5" fill="none" stroke="#8A6FC4" stroke-width="1.1" opacity="0.65"/>
	<g fill="#EBDCFF" opacity="0.9">
		<circle cx="48" cy="31" r="1.5"/>
		<circle cx="62.7" cy="56.5" r="1.5"/>
		<circle cx="33.3" cy="56.5" r="1.5"/>
		<circle cx="48" cy="65" r="1.5"/>
		<circle cx="33.3" cy="39.5" r="1.5"/>
		<circle cx="62.7" cy="39.5" r="1.5"/>
	</g>

	<!-- Obsidian swivel collar. -->
	<circle cx="48" cy="48" r="12" fill="#241C33"/>
	<circle cx="48" cy="48" r="10.2" fill="url(#obsidian)"/>
	<circle cx="48" cy="48" r="6.4" fill="none" stroke="#241C33" stroke-width="1.4" opacity="0.55"/>
	<g fill="#241C33" opacity="0.8">
		<circle cx="54" cy="42" r="1.5"/>
		<circle cx="54" cy="54" r="1.5"/>
		<circle cx="42" cy="54" r="1.5"/>
		<circle cx="42" cy="42" r="1.5"/>
	</g>
	<path d="M 39.64 42.15 A 10.2 10.2 0 0 1 52.31 38.76" fill="none" stroke="#E6D6FF" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
</svg>
